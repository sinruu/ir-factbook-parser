# 신한금융지주 FactBook 파싱 규칙

company:
  name: "신한금융지주"
  name_en: "Shinhan Financial Group"
  code: "shinhan"

file_patterns:
  - "*SFG*FactBook*.xlsx"
  - "*신한*.xlsx"
  - "SFG_FactBook_3Q25.xlsx"

# =============================================================================
# 시트별 파싱 규칙
# =============================================================================
# 신한은 시트명 접미사로 엔티티 구분:
# _SHB = Shinhan Bank (은행)
# _Card = Card (카드)
# 없으면 = Group (지주)

sheets:
  # ----- Financial Highlights -----
  Financial Highlights:
    entity: "지주"
    category: "Financial Highlights"
    structure:
      header_row: 2          # 0-indexed
      data_start_row: 3
      metric_columns: [4]    # 단일 열
      data_start_col: 8
      unit_hint_row: 2
      unit_hint_col: 3       # "(Wbn)"
    period_format: "{quarter}Q{year_short}"  # 3Q25
    default_unit: "KRW_billion"
    special_handling:
      # IFRS-17 이전/이후 컬럼 병존
      # 예: 1Q22, 1Q22\n(IFRS-17)
      ifrs17_columns: true
      ifrs17_pattern: "\\(IFRS-17\\)"
      prefer_ifrs17: true  # IFRS-17 컬럼 우선 사용

  # ----- Income Statement (Group) -----
  IS:
    entity: "지주"
    category: "Income Statement"
    structure:
      header_row: 2
      data_start_row: 3
      metric_columns: [3, 4]  # 2단계 계층
      data_start_col: 8
    period_format: "{quarter}Q{year_short}"
    default_unit: "KRW_billion"
    special_handling:
      cumulative_data: true  # 데이터가 누적 형태 (1Q, 1H, 3Q, FY)
      cumulative_pattern: "1H|3Q|FY"

  # ----- Balance Sheet (Group) -----
  BS:
    entity: "지주"
    category: "Balance Sheet"
    structure:
      header_row: 2
      data_start_row: 3
      metric_columns: [3, 4]
      data_start_col: 8
    default_unit: "KRW_billion"

  # ----- Income I -----
  IncomeⅠ:
    entity: "지주"
    category: "Interest Income"
    structure:
      header_row: 2
      data_start_row: 3
      metric_columns: [3, 4]
      data_start_col: 8
    default_unit: "KRW_billion"

  # ----- Income II -----
  IncomeⅡ:
    entity: "지주"
    category: "Interest Income"
    structure:
      header_row: 2
      data_start_row: 3
      metric_columns: [3, 4]
      data_start_col: 8
    default_unit: "KRW_billion"

  # ----- NIM -----
  NIM:
    entity: "지주"
    category: "Interest Income"
    structure:
      header_row: 2
      data_start_row: 3
      metric_columns: [3, 4]
      data_start_col: 8
    default_unit: "percent"

  # ----- Non-Interest Income -----
  Non_interest Income:
    entity: "지주"
    category: "Non-Interest Income"
    structure:
