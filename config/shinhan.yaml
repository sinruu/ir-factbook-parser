# =============================================================================
# 제외할 시트
# =============================================================================

skip_sheets:
  - "Title"
  - "Table of Contents"
  - "Disclaimer"
  - "Funding_Card"
  - "BS_Factbook_Card"
  - "IS_Factbook_Card"
  - "IS_Reported_Factbook_Card"
  - "Fin Indicator"
  - "Corp Information"
  - "Contact"

# =============================================================================
# 특수 처리 규칙
# =============================================================================

special_rules:
  # 기간 형식 변환
  period_formats:
    - pattern: "(\\d)Q(\\d{2})"             # 3Q25
      output: "20{1}-Q{0}"
    - pattern: "'(\\d{2})\\.(\\d{1,2})"     # '25.9
      output: "20{0}-Q{month_to_quarter}"
    - pattern: "(\\d)H(\\d{2})"             # 1H25 (반기)
      output: "20{1}-H{0}"
    - pattern: "FY(\\d{2})"                 # FY25
      output: "20{0}-FY"

  # IFRS-17 컬럼 처리
  ifrs17_handling:
    enabled: true
    prefer_ifrs17: true
    marker: "(IFRS-17)"
    
  # 누적 데이터 처리
  cumulative_handling:
    enabled: true
    patterns:
      - "1H"    # 상반기 (1Q + 2Q)
      - "3Q"    # 3분기 누적 (1Q + 2Q + 3Q)
      - "FY"    # 연간
    extract_quarterly: true  # 누적에서 분기 데이터 추출할지

  calculated_columns:
    skip: true
    
  empty_cell_handling: "skip"
  
  number_parsing:
    decimal_separator: "."
    thousands_separator: ","
