      data_start_row: 3
      metric_columns: [3, 4]
      data_start_col: 8
    default_unit: "KRW_billion"

  # ----- G&A -----
  G&A:
    entity: "지주"
    category: "G&A Expense"
    structure:
      header_row: 2
      data_start_row: 3
      metric_columns: [3, 4]
      data_start_col: 8
    default_unit: "KRW_billion"

  # ----- Asset (Group) -----
  Asset:
    entity: "지주"
    category: "Balance Sheet"
    structure:
      header_row: 2
      data_start_row: 3
      metric_columns: [3, 4]
      data_start_col: 8
    default_unit: "KRW_billion"

  # ----- Loan (Group) -----
  Loan:
    entity: "지주"
    category: "Loans"
    structure:
      header_row: 2
      data_start_row: 3
      metric_columns: [3, 4]
      data_start_col: 8
    default_unit: "KRW_billion"

  # ----- Deposits -----
  Depos:
    entity: "지주"
    category: "Deposits"
    structure:
      header_row: 2
      data_start_row: 3
      metric_columns: [3, 4]
      data_start_col: 8
    default_unit: "KRW_billion"

  # ----- Asset Quality (Group) -----
  Asset Quality:
    entity: "지주"
    category: "Asset Quality"
