# 공통 정규화 스키마 (schema.yaml)
# 4대 금융지주 IR FactBook 데이터를 통합하기 위한 표준 스키마

# =============================================================================
# 출력 스키마 정의
# =============================================================================

output_schema:
  fields:
    - name: holding_company
      type: string
      description: "금융지주사명"
      enum: ["우리금융지주", "KB금융지주", "신한금융지주", "하나금융지주"]
      
    - name: entity
      type: string
      description: "법인/자회사 (지주, 은행, 카드, 증권 등)"
      examples: ["지주", "은행", "카드", "증권", "캐피탈", "생명보험"]
      
    - name: category
      type: string
      description: "지표 대분류"
      enum:
        - "Financial Highlights"
        - "Income Statement"
        - "Balance Sheet"
        - "Interest Income"
        - "Non-Interest Income"
        - "Asset Quality"
        - "Capital Adequacy"
        - "Loans"
        - "Deposits"
        - "Provision"
        - "Delinquency"
        - "G&A Expense"
        
    - name: metric_std
      type: string
      description: "표준화된 지표명 (영문)"
      
    - name: metric_original
      type: string
      description: "원본 지표명 (회사별 표현 그대로)"
      
    - name: period
      type: string
      description: "기간 (YYYY-QN 형식으로 통일)"
      pattern: "^\\d{4}-Q[1-4]$|^\\d{4}-FY$"
      examples: ["2024-Q3", "2024-FY"]
      
    - name: value
      type: float
      description: "수치 값"
      nullable: true
      
    - name: unit
      type: string
      description: "단위"
      enum: ["KRW_billion", "KRW_trillion", "percent", "bps", "ratio", "won", "count"]
      
    - name: is_cumulative
      type: boolean
      description: "누적 여부 (1Q~3Q 합계인지 단일 분기인지)"
      default: false

# =============================================================================
# 표준 지표 매핑 테이블
# =============================================================================

