      KB금융: "ROA"
      신한금융: "ROA"
      하나금융: "ROA (Consolidated)"

# =============================================================================
# 기간 형식 변환 규칙
# =============================================================================

period_formats:
  # 입력 형식 -> 출력 형식 (YYYY-QN)
  patterns:
    - input: "FY(\\d{4}) (\\d)Q"        # FY2024 3Q -> 2024-Q3
      output: "{0}-Q{1}"
      
    - input: "(\\d)Q(\\d{2})"            # 3Q24 -> 2024-Q3
      output: "20{1}-Q{0}"
      
    - input: "(\\d{4})\\.(\\d{2})"       # 2024.09 -> 2024-Q3
      output: "{0}-Q{quarter_from_month}"
      
    - input: "'(\\d{2})\\.(\\d{1,2})"    # '24.9 -> 2024-Q3
      output: "20{0}-Q{quarter_from_month}"
      
    - input: "FY(\\d{4})"                # FY2024 -> 2024-FY
      output: "{0}-FY"
      
    - input: "(\\d)Q(\\d{2})\\(E\\)"     # 3Q25(E) -> 2025-Q3 (Estimate)
      output: "20{1}-Q{0}"
      is_estimate: true

  month_to_quarter:
    "01": "Q1"
    "02": "Q1"
    "03": "Q1"
    "04": "Q2"
    "05": "Q2"
    "06": "Q2"
    "07": "Q3"
    "08": "Q3"
    "09": "Q3"
    "10": "Q4"
    "11": "Q4"
    "12": "Q4"

# =============================================================================
# 단위 변환 규칙
# =============================================================================

unit_detection:
  patterns:
    - pattern: "KRW in billion|bn Won|Wbn|십억원"
      unit: "KRW_billion"
      
    - pattern: "KRW in trillion|조원"
      unit: "KRW_trillion"
      
    - pattern: "%|percent|비율"
      unit: "percent"
      
    - pattern: "bps|bp"
      unit: "bps"
      
    - pattern: "Won|원"
      unit: "won"
      
    - pattern: "명|인|employees"
      unit: "count"

# =============================================================================
# 데이터 검증 규칙
# =============================================================================

validation_rules:
  # 값 범위 검증
  range_checks:
    total_assets:
      min: 0
      max: 2000000  # 2000조원 (billion 단위)
      
    npl_ratio:
      min: 0
      max: 0.2  # 20%
      
    bis_ratio:
      min: 0.05
      max: 0.3  # 5% ~ 30%
      
    nim:
      min: 0
      max: 0.1  # 10%

  # 필수 지표 (각 회사별로 반드시 있어야 하는 지표)
  required_metrics:
    - total_assets
    - net_income
    - npl_ratio
    - bis_ratio
