      하나금융: "NIM"
      
  nis:
    category: "Interest Income"
    unit: "percent"
    mappings:
      우리금융: "NIS"
      KB금융: "NIS"
      신한금융: "NIS"
      하나금융: "NIS"

  # ----- Non-Interest Income -----
  non_interest_income:
    category: "Non-Interest Income"
    unit: "KRW_billion"
    mappings:
      우리금융: "Non-Interest Income"
      KB금융: "Net other operating income(expenses)"
      신한금융: "Non-interest income (c)"
