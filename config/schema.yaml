    unit: "KRW_billion"
    mappings:
      우리금융: "Total Assets"
      KB금융: "Total Assets"
      신한금융: "Total Assets"
      하나금융: "Total Assets"
      
  total_equity:
    category: "Balance Sheet"
    unit: "KRW_billion"
    mappings:
      우리금융: "Total Equity"
      KB금융: "Total Equity"
      신한금융: "Shareholders' equity (controlling interest)"
      하나금융: "Total Equity"
      
  net_income:
