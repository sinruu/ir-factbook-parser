# =============================================================================
# 제외할 시트
# =============================================================================

skip_sheets:
  - "Home"
  - "Disclaimer"
  - "G_Structure"
  - "G_Employees"
  - "G_Credit Rating"
  - "B_Credit Rating"
  - "B_HPI"
  - "S_Key"
  - "I_Key"
  - "I_Premium"
  - "I_Ratios"
  - "I_Monthly Premium"
  - "C_Customers"
  - "C_Delinquency"
  - "L_Key"
  - "L_Premium"
  - "L_Ratios"
  - "L_APE"
  - "Other_IS"
  - "Other_BS"
  - "Contacts"

# =============================================================================
# 특수 처리 규칙
# =============================================================================

special_rules:
  # KB는 3Q25(E) 같은 추정치 표시
  estimate_marker: "(E)"
  
  # 날짜 형식이 두 가지 혼재
  period_formats:
    - pattern: "(\\d)Q(\\d{2})"      # 3Q24
      output: "20{1}-Q{0}"
    - pattern: "([A-Za-z]+)\\. (\\d{2})"  # Sep. 24
      output: "20{1}-Q{month_to_quarter}"
      
  # 연간 컬럼 (2017.0, 2018.0 형태)
  annual_column_pattern: "^\\d{4}\\.0$"
  
  calculated_columns:
    - name: "QoQ"
      skip: true
    - name: "YoY"
      skip: true
      
  empty_cell_handling: "skip"
