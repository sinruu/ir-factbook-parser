      header_row: 7
      data_start_row: 8
      metric_columns: [7]
      data_start_col: 8
    default_unit: "KRW_billion"
    metrics_override:
      - original: "NPL Ratio"
        unit: "percent"
      - original: "Precautionary & Below Ratio"
