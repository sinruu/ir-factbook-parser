      header_row: 7
      data_start_row: 8
      metric_columns: [7]
      data_start_col: 8
    default_unit: "KRW_billion"

  # ----- Group G&A -----
  G_G&A:
    entity: "지주"
    category: "G&A Expense"
    structure:
      header_row: 7
      data_start_row: 8
      metric_columns: [7]
      data_start_col: 8
    default_unit: "KRW_billion"

  # ----- Group Asset Quality -----
  G_AQ:
    entity: "지주"
    category: "Asset Quality"
