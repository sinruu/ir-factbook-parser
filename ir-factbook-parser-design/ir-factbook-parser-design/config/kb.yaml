# KB금융지주 FactBook 파싱 규칙

company:
  name: "KB금융지주"
  name_en: "KB Financial Group"
  code: "kb"

file_patterns:
  - "*KB*Factbook*.xlsx"
  - "*KB*factbook*.xlsx"
  - "2025_3Q_Factbook.xlsx"

# =============================================================================
# 시트별 파싱 규칙
# =============================================================================
# KB는 시트명에 접두사로 엔티티 구분:
# G_ = Group (지주), B_ = Bank (은행), S_ = Securities (증권)
# I_ = Insurance (보험), C_ = Card (카드), L_ = Life (생명)

sheets:
  # ----- Financial Highlights -----
  Financial Highlights:
    entity: "지주"
    category: "Financial Highlights"
    structure:
      header_row: 8          # 0-indexed
      data_start_row: 10
      metric_columns: [7]    # 단일 열에 지표명
      data_start_col: 8
      unit_hint_row: 8
      unit_hint_col: 7       # "(bn Won)"
    period_format: "{quarter}Q{year_short}"  # 3Q24
    default_unit: "KRW_billion"

  # ----- Group Income Statement -----
  G_IS:
    entity: "지주"
    category: "Income Statement"
    structure:
      header_row: 7
      data_start_row: 8
      metric_columns: [7]
      data_start_col: 8
      has_annual_columns: true
    period_format: "{quarter}Q{year_short}"
    default_unit: "KRW_billion"

  # ----- Group Balance Sheet -----
  G_BS:
    entity: "지주"
    category: "Balance Sheet"
    structure:
      header_row: 7
      data_start_row: 8
      metric_columns: [7]
      data_start_col: 8
    period_format: "{quarter}Q{year_short}"
    default_unit: "KRW_billion"

  # ----- Group Interest Income -----
  G_Interest Income:
    entity: "지주"
    category: "Interest Income"
    structure:
      header_row: 7
      data_start_row: 8
      metric_columns: [7]
      data_start_col: 8
    default_unit: "KRW_billion"

  # ----- Group Fee Income -----
  G_Fee:
    entity: "지주"
    category: "Non-Interest Income"
    structure:
      header_row: 7
      data_start_row: 8
      metric_columns: [7]
      data_start_col: 8
    default_unit: "KRW_billion"

  # ----- Group Other Income -----
  G_Other:
    entity: "지주"
    category: "Non-Interest Income"
    structure:
      header_row: 7
      data_start_row: 8
      metric_columns: [7]
      data_start_col: 8
    default_unit: "KRW_billion"

  # ----- Group Provision -----
  G_Provision:
    entity: "지주"
    category: "Provision"
